name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend typecheck and tests
        working-directory: backend
        run: |
          npm install
          npm run lint
          npm test
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm install
          npm run build
